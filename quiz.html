<!-- Live quiz for students: join with the game PIN from the projector and a name (no account), tap the colour of the answer. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>TVMCHMED Live quiz</title>
<meta name="theme-color" content="#46178F">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --purple: #46178F; --red: #E21B3C; --blue: #1368CE; --yellow: #D89E00; --green: #26890C; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(160deg, #2E0F63, #46178F 55%, #864CBF);
    color: #fff; min-height: 100vh; padding: max(14px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom)); }
  .wrap { max-width: 560px; margin: 0 auto; }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .top img { width: 36px; height: 36px; border-radius: 10px; background: #fff; }
  .top .grow { flex: 1; font-weight: 800; }
  .pill { background: rgba(255,255,255,.18); border-radius: 20px; padding: 6px 12px; font-weight: 700; font-size: 14px; }
  .card { background: #fff; color: #1f2937; border-radius: 16px; padding: 20px; text-align: center; }
  h1 { font-size: 30px; margin: 8px 0; text-align: center; }
  .muted { opacity: .85; text-align: center; }
  input { width: 100%; font-size: 26px; text-align: center; padding: 14px; border-radius: 12px; border: 2px solid #ddd; margin-top: 10px; font-weight: 700; }
  button { font: inherit; border: 0; cursor: pointer; }
  .go { width: 100%; margin-top: 14px; background: var(--green); color: #fff; font-size: 20px; font-weight: 800; padding: 16px; border-radius: 12px; }
  .ghost { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.5); padding: 10px 16px; border-radius: 12px; margin-top: 24px; width: 100%; font-weight: 700; }
  .err { background: #fee2e2; color: #b91c1c; border-radius: 12px; padding: 10px; margin-bottom: 10px; text-align: center; font-weight: 700; }
  .q { background: #fff; color: #111827; border-radius: 14px; padding: 18px; font-size: 19px; font-weight: 700; text-align: center; white-space: pre-wrap; margin: 10px 0; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row .grow { flex: 1; }
  .timer { width: 54px; height: 54px; border-radius: 50%; background: var(--purple); border: 3px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; }
  .timer.low { background: var(--red); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt { min-height: 110px; border-radius: 14px; color: #fff; font-size: 17px; font-weight: 800; padding: 12px; display: flex; align-items: center; gap: 10px; text-align: left; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  .opt:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .opt .s { font-size: 28px; }
  .c0 { background: var(--red); } .c1 { background: var(--blue); } .c2 { background: var(--yellow); } .c3 { background: var(--green); }
  .big { font-size: 26px; font-weight: 800; text-align: center; border-radius: 16px; padding: 28px 12px; margin: 14px 0; white-space: pre-line; }
  .ok { background: var(--green); } .bad { background: var(--red); }
  .rank { font-size: 22px; font-weight: 800; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="config.js"></script>
<script>
(function () {
  'use strict';
  const C = window.CONFIG;
  const SH = ['▲', '◆', '●', '■'];
  const app = document.getElementById('app');
  const ls = {
    get(k) { try { return localStorage.getItem('quiz_' + k) || ''; } catch (e) { return ''; } },
    set(k, v) { try { localStorage.setItem('quiz_' + k, v); } catch (e) { } },
    del(k) { try { localStorage.removeItem('quiz_' + k); } catch (e) { } }
  };
  let typedPin = '', pin = ls.get('pin'), token = ls.get('token'), st = null, error = '', busy = false, sentQ = -1, sentChoice = -1, timer = null;

  async function rpc(fn, args) {
    const h = { apikey: C.key, 'Content-Type': 'application/json' };
    if (C.key.startsWith('eyJ')) h.Authorization = 'Bearer ' + C.key;
    let r;
    try { r = await fetch(C.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers: h, body: JSON.stringify(args) }); }
    catch (e) { throw new Error('No internet connection'); }
    const t = await r.text();
    if (!r.ok) { let m = 'Server error ' + r.status; try { const o = JSON.parse(t); m = o.message || o.msg || m; } catch (e) { } throw new Error(m); }
    return t ? JSON.parse(t) : null;
  }

  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const k in attrs || {}) {
      if (k === 'class') e.className = attrs[k];
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    kids.flat().forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : String(c)); });
    return e;
  }
  const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' })[n % 10] || 'th');

  function header() {
    return el('div', { class: 'top' }, el('img', { src: 'logo.png', alt: '' }), el('div', { class: 'grow' }, st ? st.title : 'TVMCHMED Live quiz'),
      st ? el('span', { class: 'pill' }, (st.score || 0) + ' pts') : null);
  }

  function joinForm() {
    const p = el('input', { inputmode: 'numeric', maxlength: '7', placeholder: 'Game PIN', autocomplete: 'off' });
    p.value = typedPin || (new URLSearchParams(location.search).get('pin')) || pin || '';
    const n = el('input', { placeholder: 'Your name', maxlength: '30', autocomplete: 'name' });
    n.value = ls.get('name');
    const go = el('button', { class: 'go', onclick: () => join(p.value, n.value) }, busy ? 'Joining…' : 'Join ▶');
    return [el('h1', {}, '🎮 Live quiz'), el('p', { class: 'muted' }, 'Enter the game PIN shown on the screen'),
      el('div', { class: 'card' }, p, n, go)];
  }

  async function join(p, n) {
    p = (p || '').replace(/\D/g, ''); n = (n || '').trim(); typedPin = p;
    if (p.length !== 6) { error = 'The game PIN has 6 digits'; draw(); return; }
    if (!n) { error = 'Enter your name'; draw(); return; }
    ls.set('name', n);
    busy = true; error = ''; draw();
    try {
      const j = await rpc('quiz_join', { p_pin: p, p_name: n });
      pin = p; token = j.token; ls.set('pin', pin); ls.set('token', token);
      busy = false; await refresh();
    } catch (e) { busy = false; error = e.message; draw(); }
  }

  function leave() { ls.del('token'); token = ''; st = null; sentQ = -1; draw(); }

  async function refresh() {
    if (!token || busy) return;
    busy = true;
    try { st = await rpc('quiz_state', { p_pin: pin, p_token: token }); error = ''; }
    catch (e) {
      if (/Join the quiz again/.test(e.message)) { leave(); error = 'That quiz has closed. Enter a new PIN.'; }
      else error = e.message;
    }
    busy = false;
    draw();
  }

  async function answer(q, c) {
    sentQ = q; sentChoice = c; draw();
    try { await rpc('quiz_answer', { p_pin: pin, p_token: token, p_q: q, p_choice: c }); }
    catch (e) { sentQ = -1; error = e.message; draw(); }
  }

  function body() {
    const s = st, state = s.state, q = s.question;
    if (state === 'lobby') return [el('h1', {}, 'You\'re in! 🎉'), el('p', { class: 'muted' }, 'See your name on the screen.'),
      el('p', { class: 'muted' }, 'Waiting for the host to start…'), el('p', { class: 'muted' }, s.players + ' players')];
    if (state === 'question' && q) {
      const mine = s.choice != null || sentQ === s.q_index;
      const chosen = s.choice != null ? s.choice : sentChoice;
      const left = Math.ceil(s.left || 0);
      const top = el('div', { class: 'row' }, el('span', { class: 'pill grow', style: 'flex:0 0 auto' }, 'Question ' + (s.q_index + 1) + ' of ' + s.total),
        el('div', { class: 'grow' }), el('div', { class: 'timer' + (left <= 5 ? ' low' : '') }, left));
      if (mine) return [top, el('div', { class: 'q' }, q.q), el('div', { class: 'big c' + Math.max(0, chosen) }, SH[Math.max(0, chosen)] + '\nAnswer sent\nWaiting for the others…')];
      if (left <= 0) return [top, el('div', { class: 'q' }, q.q), el('div', { class: 'big bad' }, '⏰ Time\'s up')];
      return [top, el('div', { class: 'q' }, q.q), el('div', { class: 'grid' }, q.options.map((o, i) =>
        el('button', { class: 'opt c' + i, onclick: () => answer(s.q_index, i) }, el('span', { class: 's' }, SH[i]), el('span', {}, o))))];
    }
    if (state === 'ended') {
      if (timer) { clearInterval(timer); timer = null; }
      return [el('h1', {}, '🏁'), el('div', { class: 'rank' }, 'Final: ' + ord(s.rank) + ' of ' + s.players),
        el('p', { class: 'muted', style: 'font-size:20px;font-weight:800' }, s.score + ' points'),
        s.rank <= 3 ? el('h1', {}, ['🥇', '🥈', '🥉'][s.rank - 1] + ' Well done!') : null,
        el('button', { class: 'go', onclick: () => { leave(); start(); } }, 'Join another quiz')];
    }
    // reveal, leaderboard
    const answered = s.choice != null, right = answered && s.choice === s.answer;
    const out = [el('div', { class: 'big ' + (right ? 'ok' : 'bad') }, right ? '✓ Correct\n+' + s.points + ' points' : answered ? '✗ Incorrect' : '⏰ No answer')];
    if (!right && q && s.answer != null) out.push(el('div', { class: 'opt c' + s.answer, style: 'min-height:64px' }, el('span', { class: 's' }, SH[s.answer]), el('span', {}, 'Right answer: ' + q.options[s.answer])));
    out.push(el('div', { class: 'rank' }, 'You are ' + ord(s.rank) + ' of ' + s.players));
    return out;
  }

  function draw() {
    const kids = [header()];
    if (error) kids.push(el('div', { class: 'err' }, error));
    if (!token) kids.push(...joinForm());
    else if (!st) kids.push(el('p', { class: 'muted' }, 'Connecting…'));
    else {
      kids.push(...body());
      if (st.state !== 'ended') kids.push(el('button', { class: 'ghost', onclick: () => { if (confirm('Leave the quiz? Your score stays on the leaderboard.')) leave(); } }, 'Leave quiz'));
    }
    app.replaceChildren(...kids);
  }

  function start() {
    if (timer) clearInterval(timer);
    timer = setInterval(refresh, 1000);
    draw();
    refresh();
  }
  start();
})();
</script>
</body>
</html>
