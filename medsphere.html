<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>MedSphere</title>
<link rel="icon" href="medsphere-icon.png">
<style>
:root { --navy:#071233; --navy2:#0b1c4d; --gold:#f5c451; --gold2:#c8932f; --cyan:#22d3ee; --text:#eef3ff; --muted:#9fb0d8; --red:#ef4444; --green:#22c55e; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:radial-gradient(circle at 50% 0%, #10306e 0%, var(--navy) 60%); color:var(--text);
  font-family:Roboto, "Segoe UI", system-ui, sans-serif; -webkit-user-select:none; user-select:none; overflow:hidden; }
#top { display:flex; align-items:center; gap:10px; padding:10px 14px; background:rgba(5,12,40,.75); border-bottom:1px solid rgba(245,196,81,.35); }
#top img { width:36px; height:36px; border-radius:9px; }
#title { flex:1; min-width:0; }
#title b { display:block; color:var(--gold); font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#title span { display:block; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lock { font-size:11px; color:#a7f3d0; background:rgba(16,185,129,.15); border:1px solid rgba(16,185,129,.5); padding:3px 8px; border-radius:999px; white-space:nowrap; }
#stage { position:absolute; top:58px; bottom:84px; left:0; right:0; padding:8px; display:flex; flex-direction:column; gap:8px; }
#screen { display:none; flex:1 1 60%; min-height:0; background:#000; border:2px solid var(--gold); border-radius:14px; position:relative; overflow:hidden; }
#screen video { width:100%; height:100%; object-fit:contain; }
#grid { flex:1 1 40%; min-height:0; display:grid; gap:8px; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); grid-auto-rows:minmax(110px, 1fr); overflow:auto; }
.tile { position:relative; border-radius:14px; overflow:hidden; background:linear-gradient(145deg, #12275f, #0a1740); border:2px solid rgba(255,255,255,.08); }
.tile.speaking { border-color:var(--cyan); box-shadow:0 0 14px rgba(34,211,238,.6); }
.tile video { width:100%; height:100%; object-fit:cover; }
.tile .av { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.tile .av div { width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg, var(--gold), var(--gold2)); color:var(--navy);
  font-weight:700; font-size:24px; display:flex; align-items:center; justify-content:center; }
.tile .nm { position:absolute; left:6px; bottom:6px; right:6px; font-size:12px; background:rgba(0,0,0,.55); padding:3px 7px; border-radius:8px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tile .hand { position:absolute; top:6px; right:8px; font-size:22px; animation:wave 1s infinite alternate; }
@keyframes wave { from { transform:rotate(-12deg); } to { transform:rotate(12deg); } }
#bar { position:absolute; left:0; right:0; bottom:0; height:84px; display:flex; justify-content:center; align-items:center; gap:10px;
  background:rgba(5,12,40,.85); border-top:1px solid rgba(245,196,81,.35); padding:0 8px env(safe-area-inset-bottom); }
#bar button { width:54px; height:54px; border-radius:50%; border:1.5px solid rgba(245,196,81,.6); background:#10245a; color:#fff; font-size:22px; cursor:pointer; }
#bar button.off { background:#3b1020; border-color:var(--red); }
#bar button.on { background:linear-gradient(135deg, var(--gold), var(--gold2)); color:var(--navy); }
#bar button.leave { background:var(--red); border-color:var(--red); width:64px; border-radius:28px; }
#bar small { display:block; font-size:9px; margin-top:-2px; }
#people { display:none; position:absolute; right:8px; top:64px; bottom:92px; width:min(320px, 92vw); background:#0b1a47; border:1px solid var(--gold2);
  border-radius:16px; padding:12px; overflow:auto; z-index:5; }
#people h3 { margin:0 0 8px; color:var(--gold); font-size:15px; }
#people .row { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,.08); font-size:14px; }
#people .row span { flex:1; }
#people button { background:transparent; border:1px solid var(--gold2); color:var(--gold); border-radius:999px; padding:5px 10px; font-size:12px; }
#people button.red { border-color:var(--red); color:#fca5a5; }
#mark { position:fixed; inset:-50%; pointer-events:none; z-index:9; display:flex; flex-wrap:wrap; align-content:flex-start; transform:rotate(-24deg);
  color:rgba(255,255,255,.07); font-size:15px; font-weight:700; line-height:70px; }
#mark span { margin:0 40px; white-space:nowrap; }
#msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; z-index:8; text-align:center; padding:24px;
  background:radial-gradient(circle at 50% 30%, #12306e, var(--navy)); }
#msg img { width:120px; height:120px; border-radius:26px; box-shadow:0 0 40px rgba(34,211,238,.35); }
#msg p { max-width:420px; color:var(--muted); margin:0; }
#msg button { background:linear-gradient(135deg, var(--gold), var(--gold2)); color:var(--navy); font-weight:700; border:0; border-radius:999px; padding:12px 22px; font-size:15px; }
.float { position:absolute; bottom:96px; font-size:34px; z-index:7; animation:up 2.6s ease-out forwards; pointer-events:none; }
@keyframes up { from { transform:translateY(0); opacity:1; } to { transform:translateY(-260px); opacity:0; } }
#bar button { position:relative; }
#bar button i { position:absolute; top:4px; right:4px; width:11px; height:11px; border-radius:50%; background:var(--red); display:none; }
@media (max-width:520px) { #bar { gap:5px; } #bar button { width:42px; height:42px; font-size:18px; } #bar button.leave { width:50px; } }
#qaBox { display:none; position:absolute; right:8px; top:64px; bottom:92px; width:min(380px, 94vw); background:#0b1a47; border:1px solid var(--gold2);
  border-radius:16px; padding:10px 12px 12px; overflow:auto; z-index:6; }
#qaBox .tabs { display:flex; gap:6px; position:sticky; top:-10px; background:#0b1a47; padding:4px 0 8px; z-index:1; }
#qaBox .tabs button { flex:1; background:transparent; border:1px solid var(--gold2); color:var(--gold); border-radius:999px; padding:7px 8px; font-size:13px; }
#qaBox .tabs button.sel { background:linear-gradient(135deg, var(--gold), var(--gold2)); color:var(--navy); font-weight:700; }
#qaBox .tabs #qaClose { flex:0 0 36px; }
#qaBox textarea, #qaBox input:not([type]), #qaBox select { width:100%; background:#10245a; color:var(--text); border:1px solid #2a4590; border-radius:10px; padding:8px 10px; font:inherit; font-size:14px; margin:3px 0; }
#qaBox label { display:block; font-size:12px; color:var(--muted); margin:4px 0; }
#qaBox button.gold { background:linear-gradient(135deg, var(--gold), var(--gold2)); color:var(--navy); font-weight:700; border:0; border-radius:999px; padding:8px 16px; margin-top:4px; }
.ask { border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:10px; margin-bottom:6px; }
.q { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.08); font-size:14px; }
.q.done { opacity:.5; }
.q .up { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; background:#10245a; border:1px solid #2a4590; color:var(--text); border-radius:10px; padding:4px 8px; font-size:12px; }
.q .up.mine { border-color:var(--cyan); color:var(--cyan); }
.q .t { flex:1; min-width:0; overflow-wrap:anywhere; }
.q .t small { display:block; color:var(--muted); font-size:11px; margin-top:2px; }
.q .t button { margin-top:4px; background:transparent; border:1px solid var(--gold2); color:var(--gold); border-radius:999px; padding:3px 9px; font-size:11px; }
.poll { border:1px solid #2a4590; border-radius:12px; padding:10px; margin:8px 0; }
.poll b { display:block; margin-bottom:6px; }
.poll .opt { position:relative; display:block; width:100%; text-align:left; background:#10245a; border:1px solid #2a4590; color:var(--text); border-radius:10px; padding:8px 10px; margin:5px 0; font-size:14px; overflow:hidden; }
.poll .opt span { position:relative; z-index:1; }
.poll .opt .bar { position:absolute; inset:0 auto 0 0; background:rgba(34,211,238,.25); z-index:0; }
.poll .opt.mine { border-color:var(--cyan); }
.poll .opt.right { border-color:var(--green); }
.poll .opt.right .bar { background:rgba(34,197,94,.35); }
.poll small { color:var(--muted); font-size:11px; }
.poll .host { margin-top:6px; display:flex; gap:6px; }
.poll .host button { background:transparent; border:1px solid var(--gold2); color:var(--gold); border-radius:999px; padding:4px 10px; font-size:12px; }
#timer { font-weight:700; font-size:14px; padding:4px 10px; border-radius:999px; background:rgba(34,211,238,.15); border:1px solid var(--cyan); color:var(--cyan); font-variant-numeric:tabular-nums; }
#timer.low { color:#fecaca; border-color:var(--red); background:rgba(239,68,68,.18); }
#timer.up { animation:blink 1s infinite; }
@keyframes blink { 50% { opacity:.35; } }
#case { flex:0 0 auto; max-height:46%; overflow:auto; background:linear-gradient(145deg,#12306e,#0a1740); border:2px solid var(--cyan); border-radius:14px; padding:12px 14px; position:relative; }
#case h4 { margin:0 0 4px; color:var(--gold); font-size:16px; padding-right:28px; }
#case .dx { font-size:15px; font-weight:600; margin:2px 0 8px; }
#case .ln { font-size:13px; color:var(--text); margin:4px 0; }
#case .ln b { color:var(--cyan); font-weight:600; }
#case .askq { margin-top:8px; padding:8px 10px; border-radius:10px; background:rgba(245,196,81,.12); border:1px solid var(--gold2); color:var(--gold); font-size:14px; }
#case .x { position:absolute; top:6px; right:8px; background:transparent; border:0; color:var(--muted); font-size:18px; }
#case small { color:var(--muted); font-size:11px; }
#qaBox .hint { color:var(--muted); font-size:12px; margin:2px 0 6px; }
.cs { display:block; width:100%; text-align:left; background:#10245a; border:1px solid #2a4590; color:var(--text); border-radius:10px; padding:8px 10px; margin:6px 0; font-size:13px; }
.cs b { display:block; font-size:14px; }
#people .wait { color:var(--gold); font-size:13px; margin:10px 0 2px; }
#people .tbtns { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
#toast { position:absolute; left:50%; top:70px; transform:translateX(-50%); background:#0f2b6b; border:1px solid var(--gold2); padding:8px 14px; border-radius:999px;
  font-size:13px; display:none; z-index:10; }
</style>
</head>
<body>
<div id="top"><img src="medsphere-icon.png" alt=""><div id="title"><b>MedSphere</b><span id="count">Connecting…</span></div><div id="timer" hidden></div><div class="lock">🔒 End-to-end encrypted</div></div>
<div id="stage"><div id="case" hidden></div><div id="screen"></div><div id="grid"></div></div>
<div id="people"></div>
<div id="qaBox">
  <div class="tabs"><button id="tabQ" class="sel">❓ Questions <span id="qCount"></span></button><button id="tabP">📊 Polls <span id="pCount"></span></button><button id="tabC">🩺 Case</button><button id="qaClose" title="Close">✕</button></div>
  <div id="qPane">
    <div class="ask"><textarea id="qText" rows="2" maxlength="300" placeholder="Type your question for the speaker"></textarea>
      <label><input type="checkbox" id="qAnon"> Don't show my name</label>
      <button id="qSend" class="gold">Ask</button></div>
    <div id="qList"></div>
  </div>
  <div id="cPane" hidden>
    <p class="hint">Show one of your ward patients to everyone: age, sex, ward, diagnosis, latest vitals and labs. The name, IP number, phone and address are never shown.</p>
    <textarea id="cAsk" rows="2" maxlength="200" placeholder="Your question for the group (optional), e.g. Next step?"></textarea>
    <div id="cList"></div>
  </div>
  <div id="pPane" hidden>
    <div id="pMake" hidden><b>New poll or MCQ</b>
      <input id="pQ" maxlength="200" placeholder="Question, e.g. Drug of choice in this case?">
      <input class="pOpt" maxlength="80" placeholder="Option A"><input class="pOpt" maxlength="80" placeholder="Option B">
      <input class="pOpt" maxlength="80" placeholder="Option C (optional)"><input class="pOpt" maxlength="80" placeholder="Option D (optional)">
      <label>Correct answer (MCQ, optional) <select id="pRight"><option value="">None: just a poll</option><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></label>
      <button id="pSend" class="gold">Start the poll</button></div>
    <div id="pList"></div>
  </div>
</div>
<div id="bar">
  <button id="mic" title="Microphone">🎤</button>
  <button id="cam" title="Camera">📷</button>
  <button id="share" title="Share screen">🖥️</button>
  <button id="hand" title="Raise hand">✋</button>
  <button id="react" title="React">👍</button>
  <button id="qa" title="Questions and polls">💬<i id="qaDot"></i></button>
  <button id="ppl" title="Participants">👥</button>
  <button id="leave" class="leave" title="Leave">📞</button>
</div>
<div id="mark"></div>
<div id="toast"></div>
<div id="msg"><img src="medsphere-icon.png" alt="MedSphere"><b style="color:var(--gold);font-size:20px">MedSphere</b><p id="msgText">Connecting securely…</p></div>
<script src="livekit-client.umd.js"></script>
<script src="medsphere.js"></script>
</body>
</html>
